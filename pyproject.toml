[project]
name = "sift"
version = "0.1.0.dev0"
description = "Imports large CSV files into a multi-tenant catalog with bounded memory, all-or-nothing apply and idempotent imports."
readme = "README.md"
license = "MIT"
authors = [{ name = "Kaulin Mindiola" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # D8: Django 5.2 LTS. drf-spectacular and simplejwt do not declare Django 6.1 yet.
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.5",
    "drf-spectacular>=0.28",
    "channels>=4.3",
    "channels-redis>=4.2",
    "celery[redis]>=5.5",
    "redis>=5.2",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.120",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
    "boto3-stubs[s3]>=1.35",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "psutil>=6.1",
]
tools = [
    "httpx>=0.28",
    "websockets>=14.0",
]

[tool.uv]
# Sift is an application, not a library: uv installs its dependencies only.
package = false

# --- Ruff -------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown code blocks in docs/ are illustrative, not source code.
extend-exclude = ["docs"]

[tool.ruff.format]
# Always LF: Django writes migrations with CRLF on Windows.
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use plain asserts and literal credentials for fixtures.
"tests/**" = ["S101", "S105", "S106"]
# Migrations are generated code.
"**/migrations/*" = ["E501", "I001", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["sift", "tools", "tests"]

# --- Mypy -------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["sift", "tests", "manage.py"]
exclude = ["/migrations/"]
explicit_package_bases = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

# NFR-7: strict typing where the business rules and transactions live.
[[tool.mypy.overrides]]
module = ["sift.imports.domain.*", "sift.imports.services.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
no_implicit_reexport = true

# Libraries without type information.
[[tool.mypy.overrides]]
module = [
    "celery.*",
    "kombu.*",
    "channels.*",
    "channels_redis.*",
    "drf_spectacular.*",
    "rest_framework_simplejwt.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "sift.settings"

# --- Pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "sift.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib", "-ra"]
markers = [
    "property: Hypothesis property-based tests",
    "integration: tests that need PostgreSQL, Redis or MinIO",
    "chaos: tests that kill real worker processes (Linux only)",
]
asyncio_default_fixture_loop_scope = "function"

# --- Coverage ---------------------------------------------------------------

[tool.coverage.run]
source = ["sift"]
omit = ["*/migrations/*"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]
