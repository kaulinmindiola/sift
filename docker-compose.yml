# Local stack for Sift: `docker compose up --build` starts everything (NFR-8).
# Development defaults are inlined so a fresh clone runs without a .env file;
# a .env file next to this one overrides any ${VARIABLE:-default} below.

name: sift

x-app: &app
  build: .
  image: sift:dev
  environment:
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-secret-key-change-me}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Inside the compose network services are reached by name.
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: ${DB_NAME:-sift}
    DB_USER: ${DB_USER:-sift}
    DB_PASSWORD: ${DB_PASSWORD:-sift-dev-password}
    REDIS_URL: redis://redis:6379/0
    # The worker reads through the internal name; browsers get URLs signed for localhost.
    S3_ENDPOINT: http://minio:9000
    S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-sift}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-sift-dev-secret}
    S3_BUCKET: ${S3_BUCKET:-sift}
    S3_REGION: ${S3_REGION:-us-east-1}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-sift}
      POSTGRES_USER: ${DB_USER:-sift}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sift-dev-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-sift}", "-d", "${DB_NAME:-sift}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # The official minio/minio image is no longer published (ADR-015). Chainguard's
    # free image only has a moving `latest` tag, so it is pinned by digest.
    # It has no shell or curl, so there is no healthcheck: `migrate` waits for it.
    image: cgr.dev/chainguard/minio@sha256:786cb11d340b1a657de8dc899560e36e1d1fb371d3d6f3eb6c903a0bb0cec714
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-sift}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-sift-dev-secret}
    ports:
      - "9000:9000"
    volumes:
      - minio-data:/data

  migrate:
    <<: *app
    # One-shot: schema first, then the private bucket (waits up to 60 s for MinIO).
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py ensure_bucket --wait 60"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  api:
    <<: *app
    command: ["uvicorn", "sift.asgi:application", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *app
    command: ["celery", "-A", "sift", "worker", "-Q", "imports", "--loglevel", "INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    <<: *app
    # The schedule file goes to /tmp: the non-root user cannot write to /app.
    command: ["celery", "-A", "sift", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
